<div class="hk4-config-container p-3">
    <mat-card>
        <mat-card-header>
            <mat-card-title>HK4 Keypad Sequences</mat-card-title>
            <div class="spacer"></div>
            <button mat-raised-button color="primary" (click)="addSequence()" [disabled]="isLoading">
                Add Sequence
            </button>
        </mat-card-header>

        <mat-card-content>
            <div *ngIf="isLoading" class="d-flex justify-content-center m-3">
                <mat-spinner diameter="40"></mat-spinner>
            </div>

            <div *ngIf="!isLoading && sequencesKeys.length === 0" class="m-3 text-muted">
                No sequences configured. Add one to start.
            </div>

            <mat-list *ngIf="!isLoading && sequencesKeys.length > 0">
                <mat-list-item *ngFor="let key of sequencesKeys" class="sequence-list-item">
                    <div mat-line class="d-flex justify-content-between align-items-center w-100">
                        <div>
                            <strong>Key: </strong> {{ key }} <br>
                            <small class="text-muted">
                                Gong Name: {{ getGongName(settings.sequences[key].gongType) }} |
                                Areas: {{ getAreasDisplay(settings.sequences[key].areas) }} |
                                Vol: {{ settings.sequences[key].volume }} |
                                Repeat: {{ settings.sequences[key].repeat || 1 }}
                            </small>
                        </div>
                        <div>
                            <button mat-icon-button color="primary" (click)="editSequence(key)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button color="warn" (click)="removeSequence(key)">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </div>
                    <mat-divider></mat-divider>
                </mat-list-item>
            </mat-list>
        </mat-card-content>
    </mat-card>
</div>
